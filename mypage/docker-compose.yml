# PostgreSQL for My Page.
#
# Local development:   docker compose up -d   then   npm run db:push && npm run db:seed
# (port 5433 on the host, so it does not collide with another local Postgres)
# The connection string matches .env.example.
#
# The same file can run the database on the backend server; there, change the
# password (POSTGRES_PASSWORD) and do not publish the port beyond the private
# network between the two servers.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mypage
      POSTGRES_PASSWORD: mypage
      POSTGRES_DB: mypage
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mypage-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypage -d mypage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mypage-pg:
