# My Page backend: the database and the API, on the backend server.
#
#   cp .env.backend.example .env.backend        # fill in the secrets
#   docker compose -f docker-compose.backend.yml --env-file .env.backend up -d --build
#
# --env-file is required on every command: Compose reads ${...} values from it
# (by default it would read .env, which is the local development file).
#
# api       the same app image with MYPAGE_ROLE=api: only /api/* answers.
#           Listens on API_BIND, the server's private-network address, so only
#           the frontend server reaches it.
# postgres  PostgreSQL 17, reachable only from the api container.
#
# Data lives in two named volumes: mypage-pg (database) and mypage-storage
# (uploaded media, STORAGE_DIR). Both need backups. Full steps in DEPLOY.md.

name: mypage-backend

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mypage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.backend}
      POSTGRES_DB: ${POSTGRES_DB:-mypage}
    volumes:
      - mypage-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    image: mypage-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.backend
    environment:
      MYPAGE_ROLE: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-mypage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mypage}?schema=public
      STORAGE_DIR: /app/storage
    ports:
      - "${API_BIND:?set API_BIND (private IP) in .env.backend}:${API_PORT:-3000}:3000"
    volumes:
      - mypage-storage:/app/storage

volumes:
  mypage-pg:
  mypage-storage:
